version: '3.9'
services:
  dex-bot:
    build: .
    container_name: dex-momentum-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
